<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TEE XRP Wallet · Coston2</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --accent-2: #7c5cff;
    --good: #35d68a;
    --bad: #ff5d6c;
    --warn: #f5a623;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1a2140 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #241a3a 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

  header { margin-bottom: 28px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 1.7rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.95rem; max-width: 56ch; }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 10px 30px -20px rgba(0,0,0,0.6);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .card-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .card-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 7px; font-size: 0.75rem; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    margin-right: 8px;
  }
  .card p.desc { color: var(--muted); font-size: 0.87rem; margin: 6px 0 16px; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 14px; margin-bottom: 5px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; background: #0d0f15; border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 9px; font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.85rem; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #4a5064; }

  button {
    appearance: none; border: none; cursor: pointer;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 80%, var(--accent-2)));
    color: white; font-weight: 600; font-size: 0.88rem;
    padding: 11px 18px; border-radius: 10px; margin-top: 14px;
    transition: transform 0.08s, opacity 0.15s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: #1c212c; border: 1px solid var(--border); color: var(--text);
  }
  button.spin::after {
    content: ""; display: inline-block; width: 11px; height: 11px; margin-left: 8px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%;
    vertical-align: -1px; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-box {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 0.85rem;
    word-break: break-all; padding: 12px 14px; margin-top: 14px;
    background: #0d0f15; border: 1px solid var(--border); border-radius: 9px; color: var(--text);
  }
  .result-box.empty { color: #4a5064; font-style: italic; }
  .result-box.ok { border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    font-size: 0.78rem; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.on { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
  .pill.on .dot { background: var(--good); }

  .footer-link { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .footer-link:hover { color: var(--text); }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); user-select: none; }
  summary:hover { color: var(--text); }

  .log {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 0.76rem;
    white-space: pre-wrap; max-height: 220px; overflow-y: auto;
    background: #0a0c11; border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 14px; color: #9aa4b8;
  }
  .log .err { color: var(--bad); }
  .log .ok { color: var(--good); }

  .notice {
    font-size: 0.82rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    padding: 10px 12px; border-radius: 9px; margin-bottom: 18px;
  }
</style>
</head>
<body>
</body>
</html>
